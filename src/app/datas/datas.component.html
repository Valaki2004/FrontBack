<!-- {{datas|json}} -->

<div class="container">
    <div class="row">
        <div class="col-md-4 mt-3" *ngFor="let data of datas">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">{{ datas.name }}</h5>
              <p class="card-text">Név: {{data.name}} <br> Érték: {{ data.value }} <br> Kategória: {{ data.category }} <br> Idő: {{ data.timestamp }}</p>
            </div>
          </div>
        </div>
      </div>
    <form (ngSubmit)="createProduct()">
        <div class="form-group">
          <label for="name">Név</label>
          <input id="name" [(ngModel)]="newData.name" name="name" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="value">Érték</label>
          <input id="value" [(ngModel)]="newData.value" name="value" class="form-control" required >
        </div>
        <div class="form-group">
          <label for="category">Kategória</label>
          <input id="category" [(ngModel)]="newData.category" name="category" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="timestamp">Idő</label>
          <input id="timestamp" [(ngModel)]="newData.timestamp" name="timestamp" class="form-control" required type="date">
        </div>
        <button type="submit" class="btn btn-primary mt-2">Hozzáadás</button>
      </form>
    <form (ngSubmit)="updateData()">
        <button type="button" class="btn btn-secondary mt-2" (click)="patch()">Frissítés</button>
    </form>
    <button (click)="deleteData(datas.id)" class="btn btn-danger mt-2">Törlés</button>
</div>
